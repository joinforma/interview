---
# Managed by Terraform : Changes will be overwritten. Do not edit manually
name: automerge
on:
  pull_request_target:
    types:
      - labeled
      - unlabeled
      - synchronize
      - opened
      - edited
      - ready_for_review
      - reopened
      - unlocked
  pull_request_review:
    types:
      - submitted
  check_suite:
    types:
      - completed
  status: {}
jobs:
  automerge:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    if: >-
      contains(github.event.pull_request.labels.*.name, 'ready to merge')
    steps:
      - if: ${{ github.event.pull_request.base.ref == 'main' }}
        name: Enable auto-merge (main)
        env:
          GH_TOKEN: ${{ secrets.FORMABOT_GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            if gh pr merge --auto --squash "${{ github.event.pull_request.number }}" \
              --repo "${{ github.repository }}"; then
              exit 0
            fi
            echo "auto-merge attempt $attempt failed, retrying in 15s"
            sleep 15
          done
          echo "auto-merge did not succeed after 3 attempts" >&2
          exit 1
